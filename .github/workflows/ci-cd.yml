name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Typecheck, lint, build
    runs-on: ${{ github.server_url == 'https://github.com' && 'ubuntu-latest' || 'self-hosted' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci --legacy-peer-deps

      - run: npm run typecheck

      - run: npm run lint

      - run: npm test

      - run: npm run build
        env:
          # Dummy values so `next build` (which touches env-dependent modules
          # at build time) succeeds without real secrets. Never used at runtime.
          DATABASE_URL: postgresql://user:pass@localhost:5432/db
          NEXTAUTH_SECRET: ci-build-only-not-a-real-secret
          NEXTAUTH_URL: http://localhost:3000
          S3_BUCKET: ci-build-only
          S3_REGION: us-east-1
          S3_ACCESS_KEY_ID: ci-build-only
          S3_SECRET_ACCESS_KEY: ci-build-only

  deploy:
    name: Deploy to AWS test environment
    needs: test
    if: github.server_url == 'https://github.austin.utexas.edu' && github.ref == 'refs/heads/main' && github.event_name == 'push'
    # Self-hosted runner on the pge-shop-test EC2 instance (account
    # 777439247518); see docs/AWS-TEST.md. The instance is stopped between
    # uses, so this job waits in the queue until it is started.
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Sync into the test project directory
        # The runner is the deploy target itself. Sync the checkout into the
        # persistent project directory so the server's real .env (secrets,
        # NEXTAUTH_URL, TEST_PUBLIC_IP) is preserved, as in the manual deploy.
        # --delete removes files that are no longer in the repo, so a removed
        # or renamed file can't linger and break the build. The excluded paths
        # (.env*, node_modules, .next*) are not deleted.
        run: |
          rsync -a --delete --exclude='.git' --exclude='.env*' --exclude='node_modules' \
            --exclude='.next' --exclude='.next-dev' --exclude='*.tsbuildinfo' \
            "$GITHUB_WORKSPACE/" /home/ubuntu/pge-shop-test/

      - name: Rebuild and restart
        # Do not remove volumes: caddy_data holds the ACME certificate.
        working-directory: /home/ubuntu/pge-shop-test
        run: docker compose -f docker-compose.test.yml up -d --build
