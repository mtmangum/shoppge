name: Bug report
description: Something isn't working as expected
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. See error
    validations:
      required: false
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: false
  - type: dropdown
    id: role
    attributes:
      label: Which role were you logged in as?
      options:
        - requestor
        - machinist
        - admin
        - not logged in
    validations:
      required: false
  - type: input
    id: job
    attributes:
      label: Job # (if relevant)
    validations:
      required: false
