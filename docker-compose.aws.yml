version: '3.9'

# AWS deployment: app talks to real S3 (no MinIO/nginx sidecars), exposed
# directly on :80. See README for the manual deploy steps until this is
# wired into CI.

services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "80:3000"
    environment:
      DATABASE_URL: postgresql://pgeshop:${DB_PASSWORD}@db:5432/pge_shop
      NEXTAUTH_URL: ${NEXTAUTH_URL}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      AUTH_TRUST_HOST: ${AUTH_TRUST_HOST:-true}
      S3_BUCKET: ${S3_BUCKET}
      S3_REGION: ${S3_REGION}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: pge_shop
      POSTGRES_USER: pgeshop
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pgeshop -d pge_shop"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
